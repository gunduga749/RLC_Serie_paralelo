<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circuito RLC: serie y paralelo</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5EF;--fg:#14213D;--muted:#566079;--card:#FFFFFF;--line:#D9D5C8;--acc:#C2410C;--soft:#FBEBDD;
--cR:#C4500A;--cL:#0066A8;--cC:#00805E;--cI:#8E3B8C;--cQ:#B7791F;--cS:#5A6785;--grid:#E4E0D3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#14213D;--fg:#F5F3EC;--muted:#A9B4CF;--card:#1E2F55;--line:#33466F;--acc:#F4A300;--soft:#2A3A63;--cR:#FF9A57;--cL:#6CB6FF;--cC:#4FD8A8;--cI:#E6A3E0;--cQ:#F5C84C;--cS:#AEBBDA;--grid:#2E4270}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans',Arial,sans-serif;line-height:1.45;font-variant-numeric:tabular-nums}
main{max-width:1120px;margin:0 auto;padding:24px 16px 48px}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,34px);line-height:1.15}
h2{margin:0 0 8px;font-size:18px}
.sub{margin:0 0 14px;color:var(--muted)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;padding:6px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.modes,.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.modes{margin-bottom:12px}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 20px;margin-bottom:12px}
.sl{display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:center}
.sl label{font-weight:600;font-size:14px}
.sl output{font-weight:700;font-size:15px}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--acc);min-height:32px}
.sl.off{opacity:.4}
.row label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.row input[type=range]{width:120px;accent-color:var(--acc)}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--fg);font-family:inherit;font-size:13px}
.halo{paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.note{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.tile span{display:block;color:var(--muted);font-size:12.5px}
.tile b{font-size:19px}
#status{font-weight:600;margin:0 0 8px}
#why{margin:0;padding-left:18px}
#why li{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.chips button{display:flex;align-items:center;gap:8px;min-height:40px}
.chips button[aria-pressed="true"]{background:var(--soft);color:var(--fg);border-color:var(--acc)}
.chips button[aria-pressed="false"]{opacity:.55}
.chips i{width:22px;height:4px;border-radius:2px;display:inline-block}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:12px}
.grid3 .wide{grid-column:1/-1}
@media (max-width:520px){.grid3{grid-template-columns:1fr}}
@media (max-width:640px){#circ,#wave,#rsn,#pow,#ene{min-width:640px}.card{overflow-x:auto}}
.grid3 .card{margin:0}
.pair{overflow:hidden;margin-bottom:12px;border-radius:14px;transition:height .3s}
.track{display:flex;align-items:flex-start;transition:transform .35s ease}
.track>.card{flex:0 0 100%;min-width:0;margin:0;overflow-x:auto}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.cardhead h2{margin:0}
.nav{display:inline-flex;align-items:center;gap:8px;font-size:15px}
.nav b{font-size:22px;line-height:1}
@media (prefers-reduced-motion:reduce){.track,.pair{transition:none}}
</style>
</head>
<body>
<main>
<h1>Circuito RLC en serie y en paralelo con corriente alterna</h1>
<p class="sub" id="sub"></p>

<section class="card" aria-label="Controles">
<div class="modes" role="group" aria-label="Tipo de conexión">
<button data-topo="S" aria-pressed="false">Serie</button>
<button data-topo="P" aria-pressed="true">Paralelo</button>
</div>
<div class="modes" role="group" aria-label="Elementos del circuito">
<button data-mode="R" aria-pressed="false">Solo R</button>
<button data-mode="RL" aria-pressed="false">R + L</button>
<button data-mode="RC" aria-pressed="false">R + C</button>
<button data-mode="RLC" aria-pressed="true">R + L + C</button>
</div>
<div class="sliders" id="sliders"></div>
<div class="row">
<button id="play" aria-pressed="true">⏸ Pausar</button>
<label>Velocidad <input type="range" id="rate" min="0.1" max="1" step="0.05" value="0.3" aria-label="Velocidad de la animación"></label>
<button id="res">Ir a la resonancia</button>
<button id="rot" aria-pressed="true">Fasores girando</button>
</div>
</section>

<div class="pair" id="pair"><div class="track" id="track">
<section class="card" id="cardCirc">
<div class="cardhead"><h2>El circuito</h2><button class="nav" data-go="1" aria-controls="cardWave">Ver ondas <b aria-hidden="true">›</b></button></div>
<svg id="circ" viewBox="0 0 760 300" role="img" aria-label="Circuito RLC con generador de corriente alterna y las cargas moviéndose">
<g id="wires" fill="none" stroke="var(--fg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></g>
<ellipse id="haloL" cx="380" cy="70" rx="86" ry="38" fill="var(--cL)" opacity="0"/>
<g id="carriers" fill="var(--fg)" opacity=".8"></g>
<g id="gR">
<rect x="-50" y="-26" width="100" height="52" fill="var(--card)"/>
<rect id="glowR" x="-50" y="-26" width="100" height="52" fill="var(--cR)" opacity="0"/>
<path d="M-50 0H-36L-28 -18L-14 18L0 -18L14 18L28 -18L36 0H50" fill="none" stroke="var(--cR)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<g id="gL">
<rect x="-58" y="-26" width="116" height="52" fill="var(--card)"/>
<path d="M-58 0a14.5 14.5 0 0 1 29 0a14.5 14.5 0 0 1 29 0a14.5 14.5 0 0 1 29 0a14.5 14.5 0 0 1 29 0" fill="none" stroke="var(--cL)" stroke-width="3.5" stroke-linecap="round"/>
</g>
<g id="gC">
<rect x="-28" y="-30" width="56" height="60" fill="var(--card)"/>
<path d="M-28 0H-10M10 0H28" stroke="var(--fg)" stroke-width="3"/>
<path d="M-10 -24V24M10 -24V24" stroke="var(--cC)" stroke-width="4" stroke-linecap="round"/>
</g>
<g id="dotsN" fill="var(--fg)"></g>
<g id="chL" font-weight="700" fill="var(--cC)"></g>
<g id="chR" font-weight="700" fill="var(--cC)"></g>
<text x="240" y="30" text-anchor="middle" font-weight="700" fill="var(--cR)" id="lbR">R</text>
<text x="380" y="30" text-anchor="middle" font-weight="700" id="lbL" style="fill:var(--cL)">L</text>
<text x="520" y="30" text-anchor="middle" font-weight="700" id="lbC" style="fill:var(--cC)">C</text>
<text x="240" y="118" text-anchor="middle" id="tR" style="fill:var(--cR)"></text>
<text x="380" y="118" text-anchor="middle" id="tL" style="fill:var(--cL)"></text>
<text x="520" y="118" text-anchor="middle" id="tC" style="fill:var(--cC)"></text>
<circle cx="70" cy="135" r="28" fill="var(--card)" stroke="var(--fg)" stroke-width="3"/>
<path d="M52 135q9-16 18 0t18 0" fill="none" stroke="var(--fg)" stroke-width="2.5"/>
<text x="92" y="116" font-weight="700">+</text><text x="92" y="166" font-weight="700">−</text>
<text x="110" y="140" id="tV" font-weight="700"></text>
<path id="iarrow" d="M0 -13L10 5H-10Z" fill="var(--cI)" transform="translate(70 96)" opacity="0"/>
<text x="48" y="104" text-anchor="end" font-size="17" font-weight="700" style="fill:var(--cI)">i</text>
<text x="250" y="264" id="tI" text-anchor="middle" font-size="23" font-weight="700" style="fill:var(--cI)"></text>
<text x="540" y="264" id="tImax" text-anchor="middle" font-size="23" font-weight="700" style="fill:var(--cI)"></text>
<text x="400" y="292" text-anchor="middle" font-size="12" id="tGen" style="fill:var(--muted)">Generador</text>
</svg>
<p class="note" id="circnote"></p>
</section>
<section class="card" id="cardWave">
<div class="cardhead"><button class="nav" data-go="0" aria-controls="cardCirc"><b aria-hidden="true">‹</b> Ver circuito</button><h2>Ondas en el tiempo</h2><button class="nav" data-go="2" aria-controls="cardPow">Ver potencia <b aria-hidden="true">›</b></button></div>
<div class="chips" id="chips" role="group" aria-label="Curvas visibles">
<button data-s="v" aria-pressed="true"><i style="background:var(--fg)"></i>v generador</button>
<button data-s="R" aria-pressed="true"><i style="background:var(--cR)"></i>vR</button>
<button data-s="L" aria-pressed="true"><i style="background:var(--cL)"></i>vL</button>
<button data-s="C" aria-pressed="true"><i style="background:var(--cC)"></i>vC</button>
</div>
<svg id="wave" viewBox="0 0 760 470" role="img" aria-label="Gráficas de las tensiones y de la corriente en el tiempo"><g id="wst"></g><g id="wcur"></g></svg>
<p class="note" id="phitxt"></p>
</section>
<section class="card" id="cardPow">
<div class="cardhead"><button class="nav" data-go="1" aria-controls="cardWave"><b aria-hidden="true">‹</b> Ver ondas</button><h2>Potencia instantánea</h2><button class="nav" data-go="3" aria-controls="cardEne">Ver energía <b aria-hidden="true">›</b></button></div>
<div class="tiles" id="powt" style="margin-bottom:8px"></div>
<svg id="pow" viewBox="0 0 760 300" role="img" aria-label="Potencia instantánea en el tiempo"></svg>
<p class="note" id="pnow" style="font-weight:600"></p>
<p class="note" id="npow"></p></section>
<section class="card" id="cardEne">
<div class="cardhead"><button class="nav" data-go="2" aria-controls="cardPow"><b aria-hidden="true">‹</b> Ver potencia</button><h2>Energía almacenada</h2></div>
<svg id="ene" viewBox="0 0 760 300" role="img" aria-label="Energía almacenada en la bobina y el condensador"></svg>
<p class="note" id="nene"></p></section>
</div></div>

<section class="tiles" id="tiles" aria-label="Valores calculados"></section>

<section class="card" aria-live="polite">
<h2>¿Qué está pasando?</h2>
<p id="status"></p>
<ul id="why"></ul>
</section>

<div class="grid3">
<section class="card"><h2 id="hPha">Fasores</h2>
<svg id="pha" viewBox="0 0 380 380" role="img" aria-label="Diagrama de fasores"></svg>
<p class="note" id="nPha"></p></section>
<section class="card"><h2 id="hImp">Triángulo de impedancias</h2>
<svg id="imp" viewBox="0 0 380 300" role="img" aria-label="Triángulo de impedancias"></svg>
<p class="note" id="nImp"></p></section>
<section class="card wide"><h2 id="hRsn">Resonancia</h2>
<svg id="rsn" viewBox="0 0 760 320" role="img" aria-label="Corriente en función de la frecuencia"></svg>
<p class="note" id="nRsn"></p></section>
</div>
</main>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var TAU=Math.PI*2,PI=Math.PI;
var nf=function(v,d){if(!isFinite(v))return '—';if(d===undefined)d=2;if(Math.abs(v)<0.5*Math.pow(10,-d))v=0;return v.toLocaleString('es',{minimumFractionDigits:0,maximumFractionDigits:d})};
var sg=function(v){var a=Math.abs(v);return nf(v,a>=100?0:a>=10?1:2)};
var sgn=function(v,d){return (v<0?'−':'+')+nf(Math.abs(v),d)};

var S={topo:'P',V:10,R:20,L:0.1,C:1e-5,f:120,useL:true,useC:true,show:{v:1,R:1,L:1,C:1},rot:true,
playing:!matchMedia('(prefers-reduced-motion: reduce)').matches,rate:0.3,theta:PI+0.9};
var M={};
var isP=function(){return S.topo==='P'};
var DEFS=[
{k:'V',name:'Tensión del generador (pico)',min:1,max:20,log:false,fmt:function(v){return nf(v,1)+' V'}},
{k:'R',name:'Resistencia R',min:1,max:200,log:false,fmt:function(v){return nf(v,0)+' Ω'}},
{k:'L',name:'Autoinducción L',min:0.01,max:0.5,log:true,fmt:function(v){return sg(v*1000)+' mH'}},
{k:'C',name:'Capacidad C',min:1e-6,max:1e-4,log:true,fmt:function(v){return sg(v*1e6)+' µF'}},
{k:'f',name:'Frecuencia f',min:10,max:2000,log:true,fmt:function(v){return sg(v)+' Hz'}}];

/* ---------- Física ---------- */
function calc(){
var w=TAU*S.f,both=S.useL&&S.useC,f0=both?1/(TAU*Math.sqrt(S.L*S.C)):null;
if(!isP()){
var XL=S.useL?w*S.L:0,XC=S.useC?1/(w*S.C):0,X=XL-XC,Z=Math.hypot(S.R,X),I0=S.V/Z,phi=Math.atan2(X,S.R);
M={w:w,XL:XL,XC:XC,X:X,Z:Z,I0:I0,phi:phi,VR:I0*S.R,VL:I0*XL,VC:I0*XC,f0:f0,Q:both?Math.sqrt(S.L/S.C)/S.R:null,
Iref:S.V/S.R,Ibig:I0,P:I0*I0*S.R/2,pf:Math.cos(phi)};
}else{
var G=1/S.R,BL=S.useL?1/(w*S.L):0,BC=S.useC?w*S.C:0,Bn=BL-BC,Y=Math.hypot(G,Bn),J0=S.V*Y,ph=Math.atan2(Bn,G);
var IR=S.V*G,IL=S.V*BL,IC=S.V*BC,big=Math.max(IR,IL,IC,J0);
M={w:w,G:G,BL:BL,BC:BC,Bn:Bn,Y:Y,Z:1/Y,I0:J0,phi:ph,IR:IR,IL:IL,IC:IC,f0:f0,Q:both?S.R*Math.sqrt(S.C/S.L):null,
Iref:big,Ibig:big,Imin:IR,P:S.V*S.V/(2*S.R),pf:G/Y};
}}
function curveI(f){var w=TAU*f;
if(!isP()){var XL=S.useL?w*S.L:0,XC=S.useC?1/(w*S.C):0;return S.V/Math.hypot(S.R,XL-XC)}
return S.V*Math.hypot(1/S.R,(S.useL?1/(w*S.L):0)-(S.useC?w*S.C:0))}
function inst(a){var b=a-M.phi;
if(!isP())return {v:S.V*Math.sin(a),i:M.I0*Math.sin(b),R:M.VR*Math.sin(b),L:M.VL*Math.cos(b),C:-M.VC*Math.cos(b),top:S.V*Math.sin(a)};
var r=M.IR*Math.sin(a),l=-M.IL*Math.cos(a),c=M.IC*Math.cos(a),t=r+l+c;
return {v:S.V*Math.sin(a),i:t,R:r,L:l,C:c,top:t}}
function niceStep(x){var e=Math.floor(Math.log10(x)),m=x/Math.pow(10,e),n=m<1.5?1:m<3.5?2:m<7.5?5:10;return n*Math.pow(10,e)}
var iU=function(){return M.Ibig<1?{k:1000,u:'mA'}:{k:1,u:'A'}};
var fi=function(x,u){return nf(x*u.k,u.k===1?3:1)};

/* ---------- Controles ---------- */
var sl=$('#sliders');
DEFS.forEach(function(d){sl.insertAdjacentHTML('beforeend','<div class="sl" data-k="'+d.k+'"><label for="s-'+d.k+'">'+d.name+'</label><output id="o-'+d.k+'" for="s-'+d.k+'"></output><input type="range" id="s-'+d.k+'" min="0" max="1000" step="1"></div>')});
function posOf(d,v){return d.log?1000*Math.log(v/d.min)/Math.log(d.max/d.min):1000*(v-d.min)/(d.max-d.min)}
function valOf(d,s){var v=d.log?d.min*Math.pow(d.max/d.min,s/1000):d.min+(d.max-d.min)*s/1000;return d.log?Number(v.toPrecision(3)):(d.k==='R'?Math.round(v):Math.round(v*2)/2)}
function syncSlider(d){$('#s-'+d.k).value=posOf(d,S[d.k]);$('#o-'+d.k).textContent=d.fmt(S[d.k])}
DEFS.forEach(function(d){syncSlider(d);$('#s-'+d.k).addEventListener('input',function(e){S[d.k]=valOf(d,+e.target.value);$('#o-'+d.k).textContent=d.fmt(S[d.k]);refresh()})});
document.querySelectorAll('[data-mode]').forEach(function(b){b.addEventListener('click',function(){
var m=b.dataset.mode;S.useL=m.indexOf('L')>=0;S.useC=m.indexOf('C')>=0;
document.querySelectorAll('[data-mode]').forEach(function(o){o.setAttribute('aria-pressed',o===b)});refresh()})});
document.querySelectorAll('[data-topo]').forEach(function(b){b.addEventListener('click',function(){
S.topo=b.dataset.topo;document.querySelectorAll('[data-topo]').forEach(function(o){o.setAttribute('aria-pressed',o===b)});refresh()})});
document.querySelectorAll('#chips button').forEach(function(b){b.addEventListener('click',function(){
var k=b.dataset.s;S.show[k]=S.show[k]?0:1;b.setAttribute('aria-pressed',!!S.show[k]);refresh()})});
$('#play').addEventListener('click',function(){S.playing=!S.playing;this.setAttribute('aria-pressed',S.playing);this.textContent=S.playing?'⏸ Pausar':'▶ Reanudar'});
$('#rate').addEventListener('input',function(){S.rate=+this.value});
$('#rot').addEventListener('click',function(){S.rot=!S.rot;this.setAttribute('aria-pressed',S.rot);paint(S.theta)});
$('#res').addEventListener('click',function(){if(!M.f0)return;var d=DEFS[4];S.f=Math.max(d.min,Math.min(d.max,Number(M.f0.toPrecision(3))));syncSlider(d);refresh()});
if(!S.playing){$('#play').textContent='▶ Reanudar';$('#play').setAttribute('aria-pressed','false')}

/* ---------- Circuito: construcción ---------- */
var T=70,B=200,CY=135,SEGS=[],CX={R:240,L:380,C:520};
var chSign=null;
function phOf(k){return k==='R'?[M.IR,0]:k==='L'?[0,-M.IL]:[0,M.IC]}
function buildCircuit(){
var P=isP(),raw=[],X={R:240,L:380,C:520},j,n,xs=[],act=['R'];
if(!P){
[[70,135,70,70],[70,70,690,70],[690,70,690,200],[690,200,70,200],[70,200,70,135]].forEach(function(p){raw.push({p:p,br:null})});
}else{
if(S.useL)act.push('L');if(S.useC)act.push('C');
n=act.length;xs=n===1?[400]:n===2?[300,500]:[250,420,590];
act.forEach(function(k,i){X[k]=xs[i]});
raw.push({p:[70,135,70,70],br:act});
act.forEach(function(k,i){raw.push({p:[i?xs[i-1]:70,70,xs[i],70],br:act.slice(i)})});
act.forEach(function(k,i){raw.push({p:[xs[i],70,xs[i],200],br:[k]})});
for(j=n-1;j>=0;j--)raw.push({p:[xs[j],200,j?xs[j-1]:70,200],br:act.slice(j)});
raw.push({p:[70,200,70,135],br:act});
}
CX=X;
var wires='',cs='';
raw.forEach(function(sg){var p=sg.p;sg.len=Math.hypot(p[2]-p[0],p[3]-p[1]);
if(sg.br){var ia=0,ib=0;sg.br.forEach(function(k){var q=phOf(k);ia+=q[0];ib+=q[1]});sg.ia=ia;sg.ib=ib}
else{sg.ia=M.I0*Math.cos(M.phi);sg.ib=-M.I0*Math.sin(M.phi)}
wires+='<path d="M'+p[0]+' '+p[1]+'L'+p[2]+' '+p[3]+'"/>';
var c=Math.max(1,Math.round(sg.len/30));sg.cs=[];
for(var i=0;i<c;i++){sg.cs.push({s0:(i+.5)*sg.len/c})}
});
$('#wires').innerHTML=wires;
var h='';raw.forEach(function(sg,si){sg.cs.forEach(function(c,ci){h+='<circle r="4" data-s="'+si+'" data-c="'+ci+'"/>'})});
$('#carriers').innerHTML=h;
$('#carriers').querySelectorAll('circle').forEach(function(e){raw[+e.dataset.s].cs[+e.dataset.c].el=e});
SEGS=raw;
var dots='';if(P)xs.slice(0,-1).forEach(function(x){dots+='<circle cx="'+x+'" cy="'+T+'" r="5.5"/><circle cx="'+x+'" cy="'+B+'" r="5.5"/>'});
$('#dotsN').innerHTML=dots;
['R','L','C'].forEach(function(k){var g=$('#g'+k),on=!(k==='L'&&!S.useL)&&!(k==='C'&&!S.useC);g.style.display=on?'':'none';
if(!on)return;
g.setAttribute('transform',P?'translate('+X[k]+' '+CY+') rotate(90)'+(k==='C'?'':' scale(.85)'):'translate('+X[k]+' '+T+')');
